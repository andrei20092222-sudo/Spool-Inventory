weigh_spool:
  target:
    entity:
      integration: spool_inventory
      domain: sensor
  fields:
    gross_weight:
      required: true
      example: 1130
      selector:
        number:
          min: 0
          max: 12000
          step: 1
          unit_of_measurement: g
          mode: box
    spool_weight:
      example: 210
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: g
          mode: box

consume_filament:
